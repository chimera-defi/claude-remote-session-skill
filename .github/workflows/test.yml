name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the session-handoff race tests diff against a pinned
          # pre-fix commit and would silently SKIP that check in a shallow clone.
          fetch-depth: 0
      - name: Run test suite
        run: |
          set -e
          for t in tests/test-*.sh; do
            echo "=== $t ==="
            bash "$t"
          done
      - name: Run python test suite
        run: |
          set -e
          for t in tests/test-*.py; do
            echo "=== $t ==="
            python3 "$t"
          done
      - name: shellcheck
        run: |
          # SC2010 (ls | grep) excluded: session-doctor.sh globs
          # ~/.config/systemd/user for <prefix>-*.service unit files (the
          # configured CRSS_SESSION_PREFIX or a CRSS_LEGACY_PREFIXES entry)
          # this skill generates itself with a sanitized [a-z0-9-] alias
          # charset — never arbitrary/adversarial filenames — so ls|grep here
          # is safe.
          shellcheck -S warning -e SC2010 scripts/*.sh tests/*.sh
