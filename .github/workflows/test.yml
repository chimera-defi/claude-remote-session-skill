name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: |
          set -e
          for t in tests/test-*.sh; do
            echo "=== $t ==="
            bash "$t"
          done
