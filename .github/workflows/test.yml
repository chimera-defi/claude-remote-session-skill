name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: |
          set -e
          for t in tests/test-*.sh; do
            echo "=== $t ==="
            bash "$t"
          done
      - name: shellcheck
        run: |
          # SC2010 (ls | grep) excluded: session-doctor.sh globs
          # ~/.config/systemd/user for agenthost-/ah-*.service unit files this
          # skill generates itself with a sanitized [a-z0-9-] alias charset —
          # never arbitrary/adversarial filenames — so ls|grep here is safe.
          shellcheck -S warning -e SC2010 scripts/*.sh tests/*.sh
